[project]
name = "craftech-ai-chat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "llama-index-llms-bedrock-converse>=0.14.18",
    "llama-index-workflows>=2.23.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["core/src", "core"]
