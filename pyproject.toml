[project]
name = "craftech-ai-chat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.74",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "llama-index-llms-bedrock-converse>=0.14.18",
    "llama-index-workflows>=2.23.2",
    "mcp>=2.1.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["core/src", "core"]
