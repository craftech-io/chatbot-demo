name: deploy
on:
  push:
    branches: [main, staging]

permissions:
  id-token: write
  contents: read

# Dos pushes seguidos no deben correr dos `sst deploy` sobre el mismo state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: docker/setup-qemu-action@v3   # build ARM64 desde runners x86
      # El driver docker default NO buildea plataformas no nativas ni con QEMU:
      # hace falta un builder docker-container. Sin esto, el primer CI falla.
      - uses: docker/setup-buildx-action@v3
      # Sin input python-version: no existe en setup-uv@v3, y uv descarga solo
      # el Python que pide requires-python (3.13) al primer `uv run`.
      - uses: astral-sh/setup-uv@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      # `.sst/platform` es gitignoreado: sin este paso, `sst.config.ts` no
      # resuelve sus globals (`aws`, `awsnative`, `$interpolate`, ...) y el
      # typecheck de infra de abajo falla por scaffolding faltante, no por un
      # error real.
      - run: npx sst install --print-logs
      - run: npm run typecheck && npm test
      # Typecheck de sst.config.ts + infra/ (el de workspaces no los cubre).
      # Filtra el único error preexistente de .sst/platform (vendored, gitignoreado).
      - run: npm run typecheck:infra
      # El core (Python/ARM64) tiene su propia suite, corre acá antes de construir
      # la imagen que empaqueta el Runtime: si esto falla, no tiene sentido desplegar.
      - run: uv run pytest core/tests/ -v
      - run: npx sst deploy --stage ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      # Ground truth del contenedor (diagnóstico): correr la imagen recién
      # pusheada en el runner (QEMU) y exigir /ping. Si esto pasa y AgentCore
      # igual falla su health check, el problema es de la plataforma, no de la
      # imagen. FAKE_LLM evita credenciales de Bedrock.
      - name: smoke de la imagen
        if: github.ref_name != 'main'
        run: |
          IMG="776805327629.dkr.ecr.us-east-1.amazonaws.com/craftech-ai-chat-core-staging:latest"
          aws ecr get-login-password | docker login --username AWS --password-stdin 776805327629.dkr.ecr.us-east-1.amazonaws.com
          docker pull -q --platform linux/arm64 "$IMG"
          cid=$(docker run -d -p 8080:8080 -e MODEL_ID=fake -e FAKE_LLM=1 "$IMG")
          ok=""
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/ping; then ok=1; break; fi; sleep 2
          done
          echo "--- docker logs ---"
          docker logs "$cid" || true
          [ -n "$ok" ] || { echo "PING FALLÓ tras 120s"; exit 1; }
